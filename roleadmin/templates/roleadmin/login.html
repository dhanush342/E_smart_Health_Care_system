<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin Login - E-Health Care</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css">
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

	<style>
		body, html {
			margin: 0;
			padding: 0;
			min-height: 100%;
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background-color: #f8fafc;
			color: #0f172a;
		}
		.auth-wrapper {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}
		.user_card {
			width: 100%;
			max-width: 420px;
			background: #ffffff;
			border: 1px solid #e2e8f0;
			border-radius: 8px;
			padding: 36px 32px;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
		}
		.brand-header {
			text-align: center;
			margin-bottom: 28px;
		}
		.brand-header .role-tag {
			display: inline-block;
			background: #e2e8f0;
			color: #334155;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			padding: 3px 10px;
			border-radius: 4px;
			margin-bottom: 10px;
		}
		.brand-header h2 {
			font-size: 22px;
			font-weight: 700;
			color: #0f172a;
			margin: 0 0 6px 0;
		}
		.brand-header p {
			font-size: 14px;
			color: #64748b;
			margin: 0;
		}
		.form-group label {
			font-size: 13px;
			font-weight: 600;
			color: #334155;
			margin-bottom: 6px;
		}
		.input-group-text {
			background: #f1f5f9;
			color: #64748b;
			border: 1px solid #cbd5e1;
			border-right: none;
			border-radius: 6px 0 0 6px;
		}
		.form-control {
			border: 1px solid #cbd5e1;
			border-radius: 0 6px 6px 0;
			font-size: 14px;
			padding: 10px 14px;
			height: auto;
		}
		.form-control:focus {
			border-color: #0d9488;
			box-shadow: 0 0 0 1px #0d9488;
		}
		.login_btn {
			width: 100%;
			background-color: #0d9488;
			border: 1px solid #0d9488;
			color: #ffffff;
			font-size: 14px;
			font-weight: 600;
			padding: 11px 16px;
			border-radius: 6px;
			transition: background-color 0.15s ease;
		}
		.login_btn:hover {
			background-color: #0f766e;
			border-color: #0f766e;
			color: #ffffff;
		}
		.rate-limit-notice {
			font-size: 12px;
			color: #64748b;
			text-align: center;
			margin-top: 14px;
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			padding: 6px 10px;
			border-radius: 4px;
		}
		.auth-links {
			font-size: 13px;
			color: #475569;
			text-align: center;
			margin-top: 24px;
			padding-top: 20px;
			border-top: 1px solid #f1f5f9;
		}
		.auth-links a {
			color: #0d9488;
			font-weight: 600;
			text-decoration: none;
		}
		.auth-links a:hover {
			color: #0f766e;
		}
	</style>
</head>
<body>
	<div class="auth-wrapper">
		<div class="user_card">
			<div class="brand-header">
				<span class="role-tag">System Administration</span>
				<h2>Administrator Console</h2>
				<p>Sign in with hospital management credentials</p>
			</div>

			{% for message in messages %}
			<div class="alert alert-warning alert-dismissible fade show" role="alert">
				{{message}}
				<button type="button" class="close" data-dismiss="alert" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			{% endfor %}

			<form method="POST" action="">
				{% csrf_token %}
				<div class="form-group">
					<label for="username">Admin Username or Email</label>
					<div class="input-group">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-user-shield"></i></span>
						</div>
						<input id="username" type="text" name="username" placeholder="Admin username or email" class="form-control" required autocomplete="username">
					</div>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<div class="input-group">
						<div class="input-group-prepend">
							<span class="input-group-text"><i class="fas fa-lock"></i></span>
						</div>
						<input id="password" type="password" name="password" placeholder="Account password" class="form-control" required autocomplete="current-password">
					</div>
				</div>

				<div class="mt-4">
					<input class="btn login_btn" type="submit" value="Admin Sign In">
				</div>

				<div class="rate-limit-notice">
					<i class="fas fa-shield-alt mr-1"></i> Security: Maximum 5 attempts per 15 minutes.
				</div>
			</form>

			<div class="auth-links">
				<div>Protected system area. Authorized personnel only.</div>
				<div class="mt-2"><a href="/">&larr; Return to Homepage</a></div>
			</div>
		</div>
	</div>
</body>
</html>
